# =============================================================================
# CI Pipeline — Phase 5 CI Gate + WORK-001 Specification Consistency Gate
# =============================================================================
# Runs on every push to main and every PR. The pipeline has five stages:
#
#   0. spec-validation — WORK-001 governance/specification consistency gate
#                        (validator + negative tests + one-active-PR invariant
#                        + fail-closed diff-scope enforcement)
#   1. lint           — ESLint code quality
#   2. typecheck      — TypeScript strict compilation
#   3. architecture   — Regex architecture contract tests (no DB needed)
#   4. integration    — PostgreSQL-backed integration tests (requires PG)
#
# CRITICAL: The integration stage FAILS if DATABASE_URL is missing or if the
# PostgreSQL service is unhealthy. The integration tests are NOT skippable —
# they are the CI gate that proves the Phase 4.2 execution invariants and the
# Phase 5 runtime resolution actually work against a real database.
#
# The PostgreSQL service container provides a postgres:16-alpine instance.
# Prisma migrations are applied via `prisma db push` before running tests.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iaas_test?schema=public

jobs:
  # ===========================================================================
  # Specification Consistency Validation (WORK-001 gate + WORK-002 domain layer)
  # ===========================================================================
  # Governance gate for the persistent spec/ layer (IAAS-GOV-ARCH-1) and the
  # canonical domain architecture (IAAS-DOM-ARCH-1).
  #   1. runs the executable specification consistency validator
  #   2. runs the validator negative tests (proof it rejects inconsistencies)
  #      plus the one-active-PR invariant negative tests (AR-002)
  #      plus the WORK-002 baseline/matrix tests
  #   3. verifies the one-active-PR invariant (W001-AC09 / GOV-005) against
  #      LIVE GitHub state — fails closed if it cannot be established (AR-002)
  #   4. enforces the diff scope: only governance/specification artifacts and
  #      the docs/architecture baseline may change — no production IAAS
  #      implementation changes. The guard FAILS CLOSED (AR-003): an
  #      unresolvable diff base is a failure, never a skip.
  # The validator and its tests are dependency-free (node:* builtins only),
  # so this job does not install the application dependency tree.
  spec-validation:
    name: Specification Consistency Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run specification consistency validator
        run: bun run spec:validate
      - name: Run specification validator negative tests
        run: bun test tests/spec-consistency-validator.test.ts tests/pr-invariant-check.test.ts tests/work-002-baseline.test.ts tests/work-003-verified-evidence-context.test.ts tests/work-004-runtime-bootstrap.test.ts --timeout 120000
      - name: Verify one-active-PR invariant (W001-AC09, live GitHub state)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/pr-invariant-check.ts --repo ${{ github.repository }}
      - name: Enforce diff scope (no production IAAS changes)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            echo "SCOPE CHECK FAILED (fail-closed): cannot resolve diff base '$BASE'."
            echo "The production-scope guard must never be skipped; failing instead of passing without a verifiable base."
            exit 1
          fi
          CHANGED="$(git diff --name-only "$BASE"...HEAD | sort -u)"
          if [ -z "$CHANGED" ]; then
            echo "No changes relative to $BASE; diff scope check passed."
            exit 0
          fi
          VIOLATIONS="$(printf '%s\n' "$CHANGED" | grep -Ev '^(spec/|docs/architecture/|scripts/spec-validator\.ts$|scripts/pr-invariant-check\.ts$|tests/spec-consistency-validator\.test\.ts$|tests/pr-invariant-check\.test\.ts$|tests/work-002-baseline\.test\.ts$|tests/work-003-verified-evidence-context\.test\.ts$|tests/work-003-verified-evidence-pg\.test\.ts$|tests/work-004-runtime-bootstrap\.test\.ts$|tests/runtime-resolution-integration\.test\.ts$|tests/phase-5-2-execution-economics-separation\.test\.ts$|tests/phase-8b-compute-economic-pipeline\.test\.ts$|tests/vpp-4-2-execution-invariants\.test\.ts$|src/lib/domain/verified-evidence-context\.ts$|src/lib/control-plane/economic-pipeline\.ts$|src/lib/services/vpp\.service\.ts$|\.github/workflows/ci\.yml$|package\.json$)' || true)"
          if [ -n "$VIOLATIONS" ]; then
            echo "SCOPE VIOLATION: files outside the allowed governance/specification/baseline/WORK-003/WORK-004 scope were changed:"
            printf '%s\n' "$VIOLATIONS"
            exit 1
          fi
          echo "Diff scope check passed: only governance/specification/baseline/WORK-003/WORK-004 artifacts changed."
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx tsc --noEmit

  architecture-tests:
    name: Architecture Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Architecture + runtime resolution tests (no DB)
        run: bun test tests/architecture-contract.test.ts tests/runtime-resolution.test.ts --timeout 30000

  postgres-integration-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iaas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Verify DATABASE_URL is set (fail if missing)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL is not set. Integration tests require PostgreSQL."
            exit 1
          fi
          echo "DATABASE_URL is set."

      - name: Wait for PostgreSQL to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d iaas_test; then
              echo "PostgreSQL is ready."
              break
            fi
            echo "Attempt $i: PostgreSQL not ready yet..."
            sleep 2
          done

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --accept-data-loss

      - name: Run all integration tests
        run: bun test tests/vpp-4-2-execution-invariants.test.ts tests/runtime-resolution-integration.test.ts tests/phase-5-2-execution-economics-separation.test.ts tests/phase-8b-compute-economic-pipeline.test.ts tests/phase-9b-persistent-protocol-state.test.ts tests/work-003-verified-evidence-pg.test.ts --timeout 120000

      - name: Run runtime resolution tests
        run: bun test tests/runtime-resolution.test.ts --timeout 30000
