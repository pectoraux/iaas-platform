# =============================================================================
# CI Pipeline — Phase 5 CI Gate + WORK-001 Specification Consistency Gate
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iaas_test?schema=public

jobs:
  spec-validation:
    name: Specification Consistency Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run specification consistency validator
        run: bun run spec:validate
      - name: Run V6 architecture completion validator
        run: bun run v6:validate
      - name: Run specification and architecture regression tests
        run: bun test tests/spec-consistency-validator.test.ts tests/pr-invariant-check.test.ts tests/work-002-baseline.test.ts tests/work-003-verified-evidence-context.test.ts tests/work-005-fixture-isolation.test.ts tests/work-008-truth-reconciliation.test.ts tests/work-009-transform-arch-freeze.test.ts tests/work-010-transform-registry.test.ts tests/work-011-transform-runtime.test.ts tests/work-012-truth-sync.test.ts tests/work-013-transform-conformance.test.ts tests/work-014-extension-arch.test.ts tests/work-015-v4-freeze.test.ts tests/work-016-extension-registry.test.ts tests/work-017-extension-runtime.test.ts tests/work-018-extension-provenance.test.ts tests/work-019-sandbox-architecture.test.ts tests/work-021-sandbox-host.test.ts tests/work-021-active-execution-registry.test.ts tests/work-022-sandbox-lifecycle.test.ts tests/work-025-network-lifecycle.test.ts tests/acr-006-traceability.test.ts tests/v6-architecture-completion.test.ts --timeout 120000
      - name: Verify one-active-PR invariant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/pr-invariant-check.ts --repo ${{ github.repository }}
      - name: Enforce diff scope (fail closed)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            echo "SCOPE CHECK FAILED: cannot resolve diff base '$BASE'."
            exit 1
          fi
          CHANGED="$(git diff --name-only "$BASE"...HEAD | sort -u)"
          VIOLATIONS="$(printf '%s\n' "$CHANGED" | grep -Ev '^(spec/|docs/architecture/|scripts/spec-validator\.ts$|scripts/v6-architecture-validator\.ts$|scripts/pr-invariant-check\.ts$|tests/|src/app/api/|src/app/page\.tsx$|src/lib/kernel/runtime/protocol/validator-consensus\.ts$|src/lib/services/|src/lib/domain/verified-evidence-context\.ts$|src/lib/control-plane/economic-pipeline\.ts$|src/lib/bootstrap/|prisma/schema\.prisma$|prisma/migrations/|examples/tsconfig\.json$|skills/tsconfig\.json$|tsconfig\.json$|\.github/workflows/ci\.yml$|package\.json$|bun\.lock$)' || true)"
          if [ -n "$VIOLATIONS" ]; then
            echo "SCOPE VIOLATION:"
            printf '%s\n' "$VIOLATIONS"
            exit 1
          fi
          echo "Diff scope check passed."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx tsc --noEmit

  architecture-tests:
    name: Architecture Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Install Wasmtime + wasm-tools (for WORK-021 sandbox e2e tests)
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH
          # Install wasm-tools: required at runtime by WasmtimeSandboxHost for
          # AR-021-18 component import verification (wasm-tools component wit)
          # and used by the e2e suite for fixture verification.
          curl -sL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.258.0/wasm-tools-1.258.0-x86_64-linux.tar.gz | tar xz -C /tmp/
          cp /tmp/wasm-tools-1.258.0-x86_64-linux/wasm-tools $HOME/.wasmtime/bin/
      - name: Architecture + runtime resolution tests (no DB)
        run: bun test tests/architecture-contract.test.ts tests/runtime-resolution.test.ts tests/work-004-runtime-bootstrap.test.ts tests/work-007-typecheck-closure.test.ts tests/work-021-sandbox-host-e2e.test.ts --timeout 60000

  postgres-integration-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iaas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL is not set."
            exit 1
          fi
      - name: Wait for PostgreSQL to be healthy
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d iaas_test; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready."
          exit 1
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Push schema to PostgreSQL
        run: bunx prisma db push --accept-data-loss
      - name: Install Wasmtime + wasm-tools (for WORK-021 AR-021-17 revocation chain tests)
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH
          curl -sL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.258.0/wasm-tools-1.258.0-x86_64-linux.tar.gz | tar xz -C /tmp/
          cp /tmp/wasm-tools-1.258.0-x86_64-linux/wasm-tools $HOME/.wasmtime/bin/
      - name: Run all integration tests
        run: bun test tests/vpp-4-2-execution-invariants.test.ts tests/runtime-resolution-integration.test.ts tests/phase-5-2-execution-economics-separation.test.ts tests/phase-8b-compute-economic-pipeline.test.ts tests/phase-9b-persistent-protocol-state.test.ts tests/work-003-verified-evidence-pg.test.ts tests/work-010-transform-registry-pg.test.ts tests/work-011-transform-runtime-pg.test.ts tests/work-013-transform-conformance-pg.test.ts tests/work-016-extension-registry-pg.test.ts tests/work-017-extension-runtime-pg.test.ts tests/work-018-extension-provenance-pg.test.ts tests/work-021-sandbox-revocation-pg.test.ts tests/work-022-sandbox-lifecycle-pg.test.ts tests/work-025-network-lifecycle-pg.test.ts --timeout 120000
      - name: Run runtime resolution tests
        run: bun test tests/runtime-resolution.test.ts --timeout 30000
