  # The validator and its tests are dependency-free (node:* builtins only),
  # so this job does not install the application dependency tree.
  spec-validation:
    name: Specification Consistency Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run specification consistency validator
        run: bun run spec:validate
      - name: Run specification validator and architecture regression tests
        run: bun test tests/spec-consistency-validator.test.ts tests/pr-invariant-check.test.ts tests/work-002-baseline.test.ts tests/work-003-verified-evidence-context.test.ts tests/work-005-fixture-isolation.test.ts tests/work-008-truth-reconciliation.test.ts tests/work-009-transform-arch-freeze.test.ts tests/work-010-transform-registry.test.ts tests/work-011-transform-runtime.test.ts tests/work-012-truth-sync.test.ts tests/work-013-transform-conformance.test.ts tests/work-014-extension-arch.test.ts --timeout 120000
      - name: Verify one-active-PR invariant (W001-AC09, live GitHub state)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/pr-invariant-check.ts --repo ${{ github.repository }}
      - name: Enforce diff scope (no production IAAS changes)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            echo "ERROR: required base ref $BASE is unavailable; refusing to skip the scope gate"
            exit 1
          fi
          git diff --name-only "$BASE...HEAD" | while read -r f; do
            case "$f" in
              spec/*|tests/*|.github/workflows/ci.yml) ;;
              *) echo "FORBIDDEN production change: $f"; exit 1 ;;
            esac
          done